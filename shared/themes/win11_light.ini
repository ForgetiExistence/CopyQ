[General]
; ===========================================================================
;  CopyQ -- Windows 11 / Fluent 2 theme   [LIGHT variant]
;
;  Install:  copy to  <config>/themes/win11_light.ini
;            (find the dir with:  copyq info config )
;  Enable:   Configuration -> Appearance -> Theme -> win11_light -> OK
;  Pairs with:  win11_items.css in the same themes dir.
;
;  Pure data: no rebuild, no plugins, uses only stock theme option keys.
;
;  What belongs in this file
;  -------------------------
;  VALUES ONLY: colours, fonts, sizes, behaviour flags. The CSS structure
;  (which selector gets which border, radius and padding) lives in
;  Theme::resetTheme() in src/gui/theme.cpp, and the list-row structure lives
;  in win11_items.css. Do NOT paste CSS templates in here: an .ini key
;  silently overrides the built-in default, so a stale copy here is exactly
;  how the menu bar lost its divider and the rows lost their cards.
;
;  Colour provenance
;  -----------------
;  surfaces  : WinUI 3 SolidBackgroundFillColor*  (generic.xaml, light)
;  text      : WinUI 3 TextFillColor*             (generic.xaml, light)
;  accent    : Windows 11 accent ramp, AccentFillColorDefault =
;              SystemAccentColorDark1 (#0067C0) in the LIGHT theme
;  type      : Windows 11 type ramp, Segoe UI Variable Text
;  spacing   : Fluent 4px grid
; ===========================================================================

; --- window plane: SolidBackgroundFillColorBase ----------------------------
bg=#F3F3F3
alt_bg=#EEEEEE
edit_bg=#FFFFFF
notes_bg=#F9F9F9
notification_bg=#202020

; --- text: TextFillColorPrimary / Secondary --------------------------------
fg=#1A1A1A
edit_fg=#1A1A1A
num_fg=#5C5C5C
notes_fg=#5C5C5C
notification_fg=#FFFFFF

; --- accent: AccentFillColorDefault (light) = SystemAccentColorDark1 -------
sel_bg=#0067C0
sel_fg=#FFFFFF
find_bg=#0067C0
find_fg=#FFFFFF
num_sel_fg=#FFFFFF

; --- surface ramp: ControlFillColorDefault / StrokeColorDefault ------------
button_bg=#FBFBFB
button_fg=#1A1A1A
link=#003E92
link_visited=#003E92
light=#FFFFFF
midlight=#EDEDED
mid=#D1D1D1
dark=#A0A0A0
shadow=#808080

; --- layered surfaces (Win11 planes) ---------------------------------------
; The window is three stacked planes. bg is the chrome plane; cards sit ON TOP
; and must be LIGHTER so they read as raised, separated by a 1px stroke.
;   card_bg        = SolidBackgroundFillColorBase (light) -- the raised plane
;   card_stroke    = CardStrokeColorDefault        (light) -- 1px hairline
;   divider        = DividerStrokeColorDefault     (light)
;   subtle_*       = SubtleFillColorSecondary / Tertiary  -- hover / pressed
;   control_stroke = ControlStrokeColorDefault     (light)
card_bg=#FFFFFF
card_stroke=#EBEBEB
divider=#E5E5E5
subtle_hover=#F5F5F5
subtle_pressed=#EDEDED
control_stroke=#D1D1D1

; --- type: Segoe UI Variable (Win11), Cascadia Mono for the editor ----------
font="Segoe UI Variable Text,10,-1,5,50,0,0,0,0,0"
edit_font="Cascadia Mono,10,-1,5,50,0,0,0,0,0"
find_font="Segoe UI Variable Text,10,-1,5,50,0,0,0,0,0"
num_font="Segoe UI Variable Text,8,-1,5,25,0,0,0,0,0"
notes_font="Segoe UI Variable Text,10,-1,5,50,0,0,0,0,0"
notification_font="Segoe UI Variable Text,10,-1,5,50,0,0,0,0,0"

; --- templates: stock chrome; win11_items.css is the Win11 list override ----
css_template_items=win11_items
css_template_main_window=main_window
css_template_menu=menu
css_template_notification=notification

; --- behaviour -------------------------------------------------------------
show_number=true
show_scrollbars=true
style_main_window=true
use_system_icons=false
font_antialiasing=true

; --- spacing: Fluent 4px grid; 4px between entry cards ---------------------
; The gap is what makes neighbouring entry cards read as separate objects.
item_spacing=4

; --- entry-card fragments consumed by win11_items.css ----------------------
; Radius only: the stroke is set in win11_items.css so it can follow the
; hover/selected state. cur_item_css must not re-declare `border` or it would
; erase the 2px focus ring that win11_items.css draws.
item_css="padding: 0.4em 0.6em"
alt_item_css=
sel_item_css="border-radius: 4px"
hover_item_css="border-radius: 4px"
cur_item_css="border-radius: 4px"
notes_css=
