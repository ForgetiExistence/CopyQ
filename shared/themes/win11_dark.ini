[General]
; ===========================================================================
;  CopyQ -- Windows 11 / Fluent 2 theme   [DARK variant]
;  Install:  copy to  <config>/themes/win11_dark.ini
;            (find the dir with:  copyq info config )
;  Enable:   Configuration -> Appearance -> Theme -> win11_dark -> OK
;  Pairs with:  win11_items.css and scrollbar.css in the same themes dir.
;
;  Pure data: no rebuild, no plugins, uses only stock theme option keys.
;
;  Colour provenance
;  -----------------
;  surfaces  : WinUI 3 SolidBackgroundFillColor*  (generic.xaml, dark)
;  text      : WinUI 3 TextFillColor*             (generic.xaml, dark)
;  accent    : Windows 11 accent ramp, AccentFillColorDefault =
;              SystemAccentColorLight2 (#4CC2FF) in the DARK theme
;  type      : Windows 11 type ramp, Segoe UI Variable Text
;  spacing   : Fluent 4px grid (item_spacing 2px nudge)
;
;  NOTE: bg=#202020 has lightness < 100, so on Qt >= 6.8 CopyQ flips the
;  native title bar to dark automatically (theme.cpp lightThreshold=100).
; ===========================================================================

; --- surfaces: SolidBackgroundFillColorBase / Secondary / Tertiary ---------
bg=#202020
alt_bg=#2B2B2B
edit_bg=#2D2D2D
notes_bg=#2D2D2D
notification_bg=#2D2D2D

; --- text: TextFillColorPrimary / Secondary --------------------------------
fg=#FFFFFF
edit_fg=#FFFFFF
num_fg=#9A9A9A
notes_fg=#C8C8C8
notification_fg=#FFFFFF

; --- accent: AccentFillColorDefault (dark) = SystemAccentColorLight2 -------
sel_bg=#4CC2FF
sel_fg=#000000
find_bg=#005FB8
find_fg=#FFFFFF
num_sel_fg=#000000

; --- type: Segoe UI Variable (Win11), Cascadia Mono for the editor ----------
font="Segoe UI Variable Text,10,-1,5,50,0,0,0,0,0"
edit_font="Cascadia Mono,10,-1,5,50,0,0,0,0,0"
find_font="Segoe UI Variable Text,10,-1,5,50,0,0,0,0,0"
num_font="Segoe UI Variable Text,8,-1,5,25,0,0,0,0,0"
notes_font="Segoe UI Variable Text,10,-1,5,50,0,0,0,0,0"
notification_font="Segoe UI Variable Text,10,-1,5,50,0,0,0,0,0"

; --- templates: stock chrome; win11_items.css is the Win11 list override ----
css_template_items=win11_items
css_template_main_window=main_window
css_template_menu=menu
css_template_notification=notification

; --- behaviour -------------------------------------------------------------
show_number=true
show_scrollbars=true
style_main_window=true
use_system_icons=false
font_antialiasing=true

; --- spacing: Fluent 4px grid, 2px between rows ----------------------------
item_spacing=2

; --- item-list fragments consumed by items.css -----------------------------
item_css="padding: 0.4em 0.6em"
alt_item_css=
sel_item_css="border-radius: 4px"
hover_item_css="border-radius: 4px"
cur_item_css="border-radius: 4px"
notes_css=

; --- menus: WinUI flyout card, OverlayCornerRadius 8px, 1px stroke ----------
menu_css="
    ;background: #2C2C2C
    ;color: ${fg}
    ;border: 1px solid #3D3D3D
    ;border-radius: 8px
    ;padding: 4px"
menu_bar_css="
    ;background: ${bg}
    ;color: ${fg}"
menu_bar_selected_css="
    ;background: #333333
    ;color: ${fg}"
menu_bar_disabled_css="
    ;color: #6B6B6B"

; --- tool bar: flat, buttons get a 4px subtle-fill hover --------------------
tool_bar_css="
    ;color: ${fg}
    ;background-color: ${bg}
    ;border: 0"
tool_button_css="
    ;background: transparent
    ;border: 0
    ;border-radius: 4px
    ;padding: 4px"
tool_button_selected_css="
    ;background: #333333
    ;border: 0
    ;border-radius: 4px"
tool_button_pressed_css="
    ;background: #3D3D3D
    ;border-radius: 4px"

; --- tabs: Win11 pivot look -- flat, 2px accent underline on the active tab --
tab_bar_css="
    ;background: ${bg}
    ;border-bottom: 1px solid #333333"
tab_bar_tab_selected_css="
    ;padding: 0.5em 0.9em
    ;background: ${bg}
    ;border: 0
    ;border-bottom: 2px solid ${sel_bg}
    ;color: ${fg}"
tab_bar_tab_unselected_css="
    ;padding: 0.5em 0.9em
    ;background: ${bg}
    ;border: 0
    ;border-bottom: 2px solid transparent
    ;color: #9A9A9A"
tab_bar_scroll_buttons_css="
    ;background: transparent
    ;color: ${fg}
    ;border: 0"
tab_bar_item_counter="
    ;color: ${num_fg}
    ;font-size: 8pt"
tab_bar_sel_item_counter="
    ;color: ${sel_bg}"

tab_tree_css="
    ;font-family: 'Segoe UI Variable Text'
    ;font-size: 10pt
    ;padding: .20em
    ;color: ${fg}
    ;background-color: ${bg}"
tab_tree_sel_item_css="
    ;color: ${fg}
    ;background: #333333
    ;border-radius: 4px"
tab_tree_item_counter="
    ;padding: .33em
    ;color: ${num_fg}
    ;font-size: 8pt"
tab_tree_sel_item_counter="
    ;color: ${sel_bg}"

; --- search box: WinUI TextBox -- 1px stroke, 4px radius, accent on focus ----
search_bar="
    ;background: ${edit_bg}
    ;color: ${edit_fg}
    ;border: 1px solid #3D3D3D
    ;border-radius: 4px
    ;padding: 4px 8px
    ;margin: 2px"
search_bar_focused="
    ;border: 1px solid ${sel_bg}
    ;border-bottom: 2px solid ${sel_bg}"
